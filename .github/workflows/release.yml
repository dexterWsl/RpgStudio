name: 发布

# 打 tag（v2026.11.04 这种）就自动出一个可以直接下载的发布包。
# 手动跑也可以：仓库 → Actions → 发布 → Run workflow。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v）
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 版本号：tag 优先，其次手动输入，最后退回 app/version.json
      - name: 定版本号
        id: ver
        run: |
          V="${{ github.ref_name }}"
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本：$V"

      - name: 语法检查
        run: |
          fail=0
          for f in $(find app tools -name '*.js'); do node --check "$f" || fail=1; done
          exit $fail

      - name: 打完整包（自带 Node.js，下载即可用）
        run: node tools/build-release.js --version "${{ steps.ver.outputs.version }}" --out dist

      - name: 打轻量包（电脑上已装 Node.js 18+ 时用，跨平台）
        run: node tools/build-release.js --version "${{ steps.ver.outputs.version }}" --no-runtime --out dist-lite

      - name: 汇总
        run: |
          ls -lh dist dist-lite
          cat dist/*.sha256 dist-lite/*.sha256

      - uses: softprops/action-gh-release@v2
        with:
          name: rpgStudio ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
            dist-lite/*.zip
            dist-lite/*.sha256
          body: |
            ## 下载哪个

            | 文件 | 说明 |
            | --- | --- |
            | `rpgStudio-${{ steps.ver.outputs.version }}-win-x64.zip` | **推荐**。自带 Node.js，解压后双击「启动.cmd」就能用，什么都不用装。 |
            | `rpgStudio-${{ steps.ver.outputs.version }}-lite.zip` | 只有编辑器本体，需要电脑上已经装了 Node.js 18 以上。跨平台。 |

            ## 怎么用

            1. 下载 zip，解压到一个普通的文件夹（别放 `C:\Program Files` 这种要管理员权限的地方，放 D 盘、桌面都行）。
            2. 双击 `启动.cmd`，会先检查环境，然后自动打开浏览器。
            3. 第一次用：在「选择游戏」里导入你的 RPG Maker 工程（选本机文件夹，或者上传 zip）。改的是副本还是原文件夹，自己选。

            轻量包：解压后 `node app/studio/server.js`，再打开 <http://127.0.0.1:8700/studio>。

            每个 zip 旁边有 `.sha256`，下载后可以核对：
            ```
            sha256sum -c rpgStudio-${{ steps.ver.outputs.version }}-win-x64.zip.sha256
            ```

            只在本机跑（只听 127.0.0.1），没有登录、没有账号，改游戏数据前会自动备份。
